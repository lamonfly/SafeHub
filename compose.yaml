# SafeHub: `docker compose up -d`, then open http://<this machine>:3000
# Easiest: add services on the Settings page. Settings below are optional
# and win over the Settings page. Details: README.md
services:
  safehub:
    # Built and tested by GitHub on every change to main.
    # Update: docker compose pull && docker compose up -d
    image: ghcr.io/lamonfly/safehub:latest
    container_name: safehub
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PUID: 1000
      PGID: 1000
      # DATABASE_PATH: ./data/safehub.db

      # Login (secret is auto-generated; URL only behind HTTPS)
      # BETTER_AUTH_SECRET:
      # BETTER_AUTH_URL: https://safehub.example.lan
      # BETTER_AUTH_TRUSTED_ORIGINS: http://192.168.1.20:3000

      # Proxmox (certificate trusted automatically; the last two override that)
      # PROXMOX_URL: https://192.168.1.10:8006
      # PROXMOX_TOKEN_ID: root@pam!safehub
      # PROXMOX_TOKEN_SECRET:
      # PROXMOX_CA_CERT_PATH: ./certs/pve-root-ca.pem
      # PROXMOX_ALLOW_SELF_SIGNED: "true"
      # PROXMOX_BACKUP_MAX_AGE_DAYS: "7"   # warn when a guest's newest backup is older

      # Synology (certificate trusted automatically; the last two override that)
      # SYNOLOGY_URL: https://192.168.1.11:5001
      # SYNOLOGY_USERNAME:
      # SYNOLOGY_PASSWORD:
      # SYNOLOGY_CA_CERT_PATH: ./certs/synology-ca.pem
      # SYNOLOGY_ALLOW_SELF_SIGNED: "true"

      # Services (Sonarr, Radarr, Prowlarr, Bazarr, Seerr: automatic with the
      # appdata volumes below; settings here override what is found)
      # SONARR_URL: http://192.168.1.20:8989
      # SONARR_API_KEY:
      # RADARR_URL: http://192.168.1.20:7878
      # RADARR_API_KEY:
      # PROWLARR_URL: http://192.168.1.20:9696
      # PROWLARR_API_KEY:
      # BAZARR_URL: http://192.168.1.20:6767
      # BAZARR_API_KEY:
      # JELLYFIN_URL: http://192.168.1.20:8096
      # JELLYFIN_API_KEY:
      # SEERR_URL: http://192.168.1.20:5055
      # SEERR_API_KEY:
      # IMMICH_URL: http://192.168.1.20:2283
      # IMMICH_API_KEY:

      # Phone notifications via ntfy (topic: pick a long random name).
      # With the ntfy service below: NTFY_URL: http://ntfy, NTFY_TOPIC: safehub
      # and the token from "ntfy token add" (README: Own ntfy server).
      # NTFY_TOPIC: safehub-kx7q2m9v4t
      # NTFY_URL: https://ntfy.sh
      # NTFY_TOKEN:
      # NTFY_CRITICAL_ONLY: "true"

      # Updates (checks GitHub once a week)
      # DISABLE_UPDATE_CHECK: "true"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      # Auto-setup: each app's config folder, read-only, named like its container
      # - ../servarr/sonarr:/app/appdata/sonarr:ro
      # - ../servarr/radarr:/app/appdata/radarr:ro
      # - ../servarr/prowlarr:/app/appdata/prowlarr:ro
      # - ../servarr/bazarr:/app/appdata/bazarr:ro
      # - ../servarr/jellyseerr:/app/appdata/jellyseerr:ro
      # Docker: list this machine's containers and start/stop/restart them.
      # Gives SafeHub full control of Docker, which equals root on this machine.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # To reach another stack's containers by name (http://sonarr:8989):
    # networks: [default, servarr]

  # Own ntfy server for phone notifications (optional; Android app). Nothing
  # leaves your network. Uncomment, set the base URL to this machine's address,
  # then create the users and token as described in README.md (Own ntfy server).
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   container_name: ntfy
  #   command: serve
  #   ports:
  #     - "8080:80"
  #   environment:
  #     NTFY_BASE_URL: http://192.168.1.20:8080   # what the phone app connects to
  #     NTFY_CACHE_FILE: /var/lib/ntfy/cache.db   # keeps messages while the phone is offline
  #     NTFY_CACHE_DURATION: 24h
  #     NTFY_AUTH_FILE: /var/lib/ntfy/user.db
  #     NTFY_AUTH_DEFAULT_ACCESS: deny-all        # only the users you create
  #   volumes:
  #     - ./ntfy:/var/lib/ntfy
  #   restart: unless-stopped

# networks:
#   servarr:
#     external: true
#     name: servarr_default
