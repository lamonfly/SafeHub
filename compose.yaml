# SafeHub: `docker compose up -d`, then open http://<this machine>:3000
# Easiest: add services on the Settings page. Settings below are optional
# and win over the Settings page. Details: README.md
services:
  safehub:
    build:
      context: https://github.com/lamonfly/SafeHub.git#main
    image: safehub:latest
    container_name: safehub
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PUID: 1000
      PGID: 1000
      # DATABASE_PATH: ./data/safehub.db

      # Login (secret is auto-generated; URL only behind HTTPS)
      # BETTER_AUTH_SECRET:
      # BETTER_AUTH_URL: https://safehub.example.lan
      # BETTER_AUTH_TRUSTED_ORIGINS: http://192.168.1.20:3000

      # Proxmox (certificate trusted automatically; the last two override that)
      # PROXMOX_URL: https://192.168.1.10:8006
      # PROXMOX_TOKEN_ID: root@pam!safehub
      # PROXMOX_TOKEN_SECRET:
      # PROXMOX_CA_CERT_PATH: ./certs/pve-root-ca.pem
      # PROXMOX_ALLOW_SELF_SIGNED: "true"

      # Synology (certificate trusted automatically; the last two override that)
      # SYNOLOGY_URL: https://192.168.1.11:5001
      # SYNOLOGY_USERNAME:
      # SYNOLOGY_PASSWORD:
      # SYNOLOGY_CA_CERT_PATH: ./certs/synology-ca.pem
      # SYNOLOGY_ALLOW_SELF_SIGNED: "true"

      # Services (Sonarr, Radarr, Prowlarr, Bazarr, Seerr: automatic with the
      # appdata volumes below; settings here override what is found)
      # SONARR_URL: http://192.168.1.20:8989
      # SONARR_API_KEY:
      # RADARR_URL: http://192.168.1.20:7878
      # RADARR_API_KEY:
      # PROWLARR_URL: http://192.168.1.20:9696
      # PROWLARR_API_KEY:
      # BAZARR_URL: http://192.168.1.20:6767
      # BAZARR_API_KEY:
      # JELLYFIN_URL: http://192.168.1.20:8096
      # JELLYFIN_API_KEY:
      # SEERR_URL: http://192.168.1.20:5055
      # SEERR_API_KEY:
      # IMMICH_URL: http://192.168.1.20:2283
      # IMMICH_API_KEY:

      # Updates (checks GitHub once a week)
      # DISABLE_UPDATE_CHECK: "true"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      # Auto-setup: each app's config folder, read-only, named like its container
      # - ../servarr/sonarr:/app/appdata/sonarr:ro
      # - ../servarr/radarr:/app/appdata/radarr:ro
      # - ../servarr/prowlarr:/app/appdata/prowlarr:ro
      # - ../servarr/bazarr:/app/appdata/bazarr:ro
      # - ../servarr/jellyseerr:/app/appdata/jellyseerr:ro
    restart: unless-stopped
    # To reach another stack's containers by name (http://sonarr:8989):
    # networks: [default, servarr]

# networks:
#   servarr:
#     external: true
#     name: servarr_default
