name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Route types (PageProps, LayoutProps...) are generated by Next; a fresh
      # checkout has none, so generate them before type-checking.
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders, as in the Dockerfile: real values are runtime-only.
          BETTER_AUTH_SECRET: build-only-placeholder-not-used-at-runtime
          DATABASE_PATH: /tmp/build.db
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke test (production build, every page)
        run: npm run test:smoke

  image:
    name: Publish Docker image
    needs: test
    # Only tested commits on main become images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/safehub
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build once, run the real image (entrypoint, privilege drop, Docker
      # socket group, migrations, health route), then push exactly that image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: safehub:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          mkdir -p ci-data
          docker run -d --name safehub-ci -p 3000:3000 -v "$PWD/ci-data:/app/data" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro safehub:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            if [ "$attempt" = 30 ]; then docker logs safehub-ci; exit 1; fi
            sleep 2
          done
          # Runs unprivileged, with the socket's group for Docker access.
          status="$(docker exec safehub-ci cat /proc/1/status)"
          echo "$status" | grep -E "^(Uid|Groups):"
          echo "$status" | grep -qE "^Uid:\s+1000\s"
          echo "$status" | grep -qE "^Groups:.*\b$(stat -c %g /var/run/docker.sock)\b"
          test -f ci-data/safehub.db
          docker rm -f safehub-ci

      # No rebuild: tag and push the image that was just tested.
      - name: Push tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag safehub:ci "$tag"
            docker push "$tag"
          done
