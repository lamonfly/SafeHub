name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Route types (PageProps, LayoutProps...) are generated by Next; a fresh
      # checkout has none, so generate them before type-checking.
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders, as in the Dockerfile: real values are runtime-only.
          BETTER_AUTH_SECRET: build-only-placeholder-not-used-at-runtime
          DATABASE_PATH: /tmp/build.db
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke test (production build, every page)
        run: npm run test:smoke

  image:
    name: Publish Docker image
    needs: test
    # Only tested commits on main become images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/safehub
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
